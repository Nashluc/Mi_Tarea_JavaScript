<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style.css">

    <title>Práctica de JavaScript</title>
</head>

<body>

    <!--
        ESTRUCTURA HTML5

        <!DOCTYPE html> indica que el documento utiliza HTML5.
        <html> contiene todo el documento.
        <head> contiene información del documento.
        <body> contiene el contenido visible.

        Elementos semánticos utilizados:
        <header> representa el encabezado.
        <main> contiene el contenido principal.
        <section> organiza el contenido por secciones.
        <footer> contiene la información final.

        JavaScript se conecta mediante un archivo externo
        utilizando la etiqueta <script>.
    -->

    <header>
        <h1>Práctica de JavaScript</h1>
        <p>Conceptos básicos, estructuras de control y funciones</p>
    </header>

    <main>

        <section>
            <h2>Conceptos básicos</h2>

            <p>
                Esta página demuestra diferentes conceptos
                fundamentales de JavaScript.
            </p>

            <button onclick="mostrarMensaje()">
                Ejecutar JavaScript
            </button>
        </section>

        <section>
            <h2>Resultados</h2>

            <p id="resultado">
                Los resultados aparecerán aquí.
            </p>
        </section>

    </main>

    <footer>
        <p>Proyecto académico - 2026</p>
    </footer>

    <!-- Archivo JavaScript externo -->
    <script src="script.js"></script>

</body>

</html>
